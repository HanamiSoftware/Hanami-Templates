name: Hanami Attribution Report

on:
  push:
    branches:
      - main

jobs:
  attribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze original authors
        shell: bash
        run: |
          echo "=== Hanami Attribution Report v3 ==="
          echo

          git ls-files '*.ts' '*.js' | while read -r file; do
            echo "File: $file"

            commit=$(git log \
              -n 1 \
              --diff-filter=A \
              --format='%H' \
              -- "$file")

            if [ -z "$commit" ]; then
              echo "  Unable to determine introduction commit"
              echo
              continue
            fi

            echo "  Introduction commit: $commit"

            git show \
              --summary \
              --find-renames \
              "$commit"

            echo
          done