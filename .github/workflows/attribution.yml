name: Hanami Attribution Report

on:
  push:
    branches:
      - main

jobs:
  attribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze file history
        shell: bash
        run: |
          echo "=== Hanami Attribution Report v2 ==="
          echo

          git ls-files '*.ts' '*.js' | while read -r file; do
            echo "File: $file"

            echo "  Introduction commits:"
            git log \
              --diff-filter=A \
              --format='    %h | %an | %ae | %ad | %s' \
              --date=short \
              -- "$file"

            echo

            echo "  Rename commits:"
            git log \
              --diff-filter=R \
              --format='    %h | %an | %ae | %ad | %s' \
              --date=short \
              -- "$file" || true

            echo
          done